<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-labelledby="title">
  <title id="title">When the app asks for 1536</title>
  <style>
    text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1c1917; }
    .h { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
    .b { font-size: 15px; }
    .s { font-size: 13px; fill: #57534e; }
    .w { fill: #faf8f5; }
  </style>
  <rect width="880" height="360" fill="#faf8f5"/>
  <text x="32" y="36" class="h">The 1536-only query fires only when already true</text>

  <rect x="32" y="64" width="250" height="132" rx="8" fill="#fff" stroke="#d6d3d1"/>
  <text x="52" y="96" class="h">Normal connection</text>
  <text x="52" y="128" class="b">RKE, Bluetooth permission</text>
  <text x="52" y="152" class="b">1.5 s after registration</text>
  <text x="52" y="176" class="s">Function array is empty</text>

  <rect x="314" y="64" width="250" height="132" rx="8" fill="#1c1917"/>
  <text x="334" y="96" class="h w">Re-check</text>
  <text x="334" y="128" class="b w">Already connected for RSPA</text>
  <text x="334" y="152" class="b w">Support flag already true</text>
  <text x="334" y="176" class="s w">Only then is 1536 requested</text>

  <rect x="596" y="64" width="252" height="132" rx="8" fill="#fff" stroke="#9a3412"/>
  <text x="616" y="96" class="h">Status packet</text>
  <text x="616" y="128" class="b">functionId is 1536</text>
  <text x="616" y="152" class="b">Status value is ignored</text>
  <text x="616" y="176" class="s">Arrival sets the flag true</text>

  <rect x="32" y="228" width="816" height="96" rx="8" fill="#fff" stroke="#d6d3d1"/>
  <text x="56" y="268" class="b">Without the button, the flow stays in the left box. The middle query never fires.</text>
  <text x="56" y="296" class="s">So "no button" cannot be read as "the controller is silent to a 1536 query."</text>
</svg>