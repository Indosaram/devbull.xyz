<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" role="img" aria-labelledby="title desc">
  <title id="title">The app never asks about 1536 first</title>
  <desc id="desc">On a normal connection the app asks for status without naming a function. A 1536-only question is sent only when reconnecting with the remote parking button already present.</desc>
  <style>
    text { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif; }
    .t { font-size: 22px; font-weight: 700; fill: #1c1917; }
    .st { font-size: 16px; fill: #57534e; }
    .h { font-size: 17px; font-weight: 700; fill: #1c1917; }
    .b { font-size: 17px; fill: #1c1917; }
    .s { font-size: 15px; fill: #57534e; }
    .xs { font-size: 12px; fill: #57534e; }
    .btn { font-size: 13px; fill: #1c1917; }
    .acc { fill: #9a3412; }
    .w { fill: #ffffff; }
    .wl { fill: #d6d3d1; }
  </style>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a3412"/></marker>
  </defs>
  <rect width="640" height="600" fill="#faf8f5"/>
  <text x="32" y="44" class="t">The app never asks about 1536 first</text>
  <text x="32" y="72" class="st">The 1536-only question goes out only when the button already exists</text>
  <rect x="24" y="96" width="592" height="200" rx="12" fill="#fff" stroke="#d6d3d1"/>
  <text x="48" y="128" class="h">Normal connection · no button yet</text>
  <rect x="48" y="148" width="80" height="96" rx="10" fill="#1c1917"/>
  <text x="88" y="202" class="h w" text-anchor="middle">Phone</text>
  <rect x="512" y="148" width="80" height="96" rx="10" fill="#44403c"/>
  <text x="552" y="202" class="h w" text-anchor="middle">Car</text>
  <line x1="132" y1="176" x2="506" y2="176" stroke="#1c1917" stroke-width="2.5" marker-end="url(#ad)"/>
  <text x="320" y="166" class="b" text-anchor="middle">Status, please (no function named)</text>
  <line x1="506" y1="222" x2="132" y2="222" stroke="#78716c" stroke-width="2.5" marker-end="url(#ad)"/>
  <text x="320" y="212" class="b" text-anchor="middle">Per-function status</text>
  <text x="48" y="276" class="s acc">No 1536 in the reply → no parking button</text>
  <rect x="24" y="312" width="592" height="176" rx="12" fill="#fff" stroke="#9a3412"/>
  <text x="48" y="344" class="h">Reconnect for parking · button already there</text>
  <rect x="48" y="364" width="80" height="96" rx="10" fill="#1c1917"/>
  <text x="88" y="418" class="h w" text-anchor="middle">Phone</text>
  <rect x="512" y="364" width="80" height="96" rx="10" fill="#44403c"/>
  <text x="552" y="418" class="h w" text-anchor="middle">Car</text>
  <line x1="132" y1="392" x2="506" y2="392" stroke="#9a3412" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="320" y="382" class="b acc" text-anchor="middle">Status of 1536, please</text>
  <line x1="506" y1="438" x2="132" y2="438" stroke="#78716c" stroke-width="2.5" marker-end="url(#ad)"/>
  <text x="320" y="428" class="b" text-anchor="middle">1536 status</text>
  
  <rect x="24" y="504" width="592" height="80" rx="12" fill="#1c1917"/>
  <text x="48" y="538" class="h w">Without the button, the 1536 question was never sent</text>
  <text x="48" y="566" class="s wl">So it can't mean "the car ignored a 1536 question."</text>
</svg>