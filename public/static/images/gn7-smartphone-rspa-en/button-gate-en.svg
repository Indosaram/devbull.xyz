<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-labelledby="title">
  <title id="title">When the remote parking button gets drawn</title>
  <style>
    text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1c1917; }
    .h { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
    .b { font-size: 15px; }
    .s { font-size: 13px; fill: #57534e; }
  </style>
  <rect width="880" height="520" fill="#faf8f5"/>
  <text x="32" y="36" class="h">The order the home card draws buttons</text>
  <text x="32" y="60" class="s">Model code, VIN, and server flags are not part of it</text>

  <rect x="250" y="84" width="380" height="52" rx="8" fill="#fff" stroke="#1c1917"/>
  <text x="440" y="116" text-anchor="middle" class="b">Digital Key 2 control card</text>

  <line x1="440" y1="136" x2="440" y2="164" stroke="#a8a29e"/>
  <polygon points="434,164 446,164 440,174" fill="#a8a29e"/>

  <rect x="210" y="178" width="460" height="52" rx="8" fill="#fff" stroke="#d6d3d1"/>
  <text x="440" y="210" text-anchor="middle" class="b">Any lock, window, or start button?</text>

  <line x1="280" y1="230" x2="160" y2="268" stroke="#a8a29e"/>
  <line x1="600" y1="230" x2="700" y2="268" stroke="#a8a29e"/>
  <text x="188" y="252" class="s">No</text>
  <text x="628" y="252" class="s">Yes</text>

  <rect x="32" y="276" width="250" height="72" rx="8" fill="#fff" stroke="#9a3412"/>
  <text x="157" y="306" text-anchor="middle" class="b">Card is not drawn</text>
  <text x="157" y="328" text-anchor="middle" class="s">May be unrelated to 1536</text>

  <rect x="560" y="276" width="288" height="52" rx="8" fill="#fff" stroke="#d6d3d1"/>
  <text x="704" y="308" text-anchor="middle" class="b">Is support flow F true?</text>

  <line x1="640" y1="328" x2="520" y2="368" stroke="#a8a29e"/>
  <line x1="760" y1="328" x2="760" y2="368" stroke="#a8a29e"/>
  <text x="548" y="356" class="s">No</text>
  <text x="772" y="356" class="s">Yes</text>

  <rect x="360" y="376" width="280" height="88" rx="8" fill="#fff" stroke="#9a3412"/>
  <text x="500" y="408" text-anchor="middle" class="b">Only other buttons show</text>
  <text x="500" y="432" text-anchor="middle" class="s">No 1536 status, cache is false</text>
  <text x="500" y="452" text-anchor="middle" class="s">Dedicated query never fires here</text>

  <rect x="660" y="376" width="188" height="72" rx="8" fill="#1c1917"/>
  <text x="754" y="408" text-anchor="middle" class="b" fill="#faf8f5">Remote parking</text>
  <text x="754" y="430" text-anchor="middle" class="s" fill="#d6d3d1">ic_filled_rspa</text>
</svg>