<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="title desc">
  <title id="title">앱 화면 세 가지와 그 뜻</title>
  <desc id="desc">카드가 없으면 잠금·창문·시동 버튼이 하나도 없는 것이고, 원격주차만 없으면 1536 신호가 오지 않은 것이며, 원격주차가 있으면 1536 신호가 왔거나 지난 기록이 남은 것이다.</desc>
  <style>
    text { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif; }
    .t { font-size: 22px; font-weight: 700; fill: #1c1917; }
    .st { font-size: 16px; fill: #57534e; }
    .h { font-size: 17px; font-weight: 700; fill: #1c1917; }
    .b { font-size: 17px; fill: #1c1917; }
    .s { font-size: 15px; fill: #57534e; }
    .xs { font-size: 12px; fill: #57534e; }
    .btn { font-size: 13px; fill: #1c1917; }
    .acc { fill: #9a3412; }
    .w { fill: #ffffff; }
    .wl { fill: #d6d3d1; }
  </style>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a3412"/></marker>
  </defs>
  <rect width="640" height="440" fill="#faf8f5"/>
  <text x="32" y="44" class="t">앱 화면 세 가지와 그 뜻</text>
  <text x="32" y="72" class="st">차종·VIN·서버 설정은 이 판단에 쓰이지 않는다</text>
  <rect x="28" y="96" width="172" height="236" rx="24" fill="#1c1917"/>
  <rect x="36" y="108" width="156" height="212" rx="16" fill="#faf8f5"/>
  <text x="50" y="136" class="xs">마이현대</text>
  <rect x="42" y="154" width="144" height="150" rx="10" fill="none" stroke="#a8a29e" stroke-dasharray="6 5"/>
  <text x="114" y="234" class="s" text-anchor="middle">카드 없음</text>
  <text x="114" y="368" class="h acc" text-anchor="middle">카드 없음</text>
  <text x="114" y="394" class="s" text-anchor="middle">잠금·창문·시동 버튼이</text>
  <text x="114" y="416" class="s" text-anchor="middle">하나도 없을 때</text>
  <rect x="234" y="96" width="172" height="236" rx="24" fill="#1c1917"/>
  <rect x="242" y="108" width="156" height="212" rx="16" fill="#faf8f5"/>
  <text x="256" y="136" class="xs">마이현대</text>
  <rect x="248" y="154" width="144" height="150" rx="10" fill="#fff" stroke="#d6d3d1"/>
  <rect x="258" y="164" width="58" height="58" rx="10" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="287" y="198" class="btn" text-anchor="middle">잠금</text>
  <rect x="324" y="164" width="58" height="58" rx="10" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="353" y="198" class="btn" text-anchor="middle">창문</text>
  <rect x="258" y="232" width="58" height="58" rx="10" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="287" y="266" class="btn" text-anchor="middle">시동</text>
  <rect x="324" y="232" width="58" height="58" rx="10" fill="none" stroke="#9a3412" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="353" y="267" class="btn acc" text-anchor="middle">?</text>
  <text x="320" y="368" class="h acc" text-anchor="middle">원격주차만 없음</text>
  <text x="320" y="394" class="s" text-anchor="middle">1536 신호가 안 왔고</text>
  <text x="320" y="416" class="s" text-anchor="middle">지난 기록도 없을 때</text>
  <rect x="440" y="96" width="172" height="236" rx="24" fill="#1c1917"/>
  <rect x="448" y="108" width="156" height="212" rx="16" fill="#faf8f5"/>
  <text x="462" y="136" class="xs">마이현대</text>
  <rect x="454" y="154" width="144" height="150" rx="10" fill="#fff" stroke="#d6d3d1"/>
  <rect x="464" y="164" width="58" height="58" rx="10" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="493" y="198" class="btn" text-anchor="middle">잠금</text>
  <rect x="530" y="164" width="58" height="58" rx="10" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="559" y="198" class="btn" text-anchor="middle">창문</text>
  <rect x="464" y="232" width="58" height="58" rx="10" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="493" y="266" class="btn" text-anchor="middle">시동</text>
  <rect x="530" y="232" width="58" height="58" rx="10" fill="#9a3412"/>
  <text x="559" y="266" class="btn w" text-anchor="middle">원격주차</text>
  <text x="526" y="368" class="h" text-anchor="middle">원격주차 있음</text>
  <text x="526" y="394" class="s" text-anchor="middle">1536 신호가 왔거나</text>
  <text x="526" y="416" class="s" text-anchor="middle">지난 기록이 남았을 때</text>
  
</svg>