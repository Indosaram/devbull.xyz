<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="title desc">
  <title id="title">스마트키와 폰은 다른 문</title>
  <desc id="desc">GN7 원격 전후진은 사용설명서상 스마트키 버튼이다. 폰은 디지털키 기능 1536 상태 패킷이 와야 버튼이 생긴다.</desc>
  <style>
    text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1c1917; }
    .label { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
    .body { font-size: 15px; }
    .small { font-size: 13px; fill: #57534e; }
  </style>
  <rect width="880" height="420" fill="#faf8f5"/>
  <text x="32" y="36" class="label">두 개의 문</text>
  <text x="32" y="62" class="small">같은 기능처럼 보여도 수신기가 다르다</text>

  <rect x="32" y="88" width="390" height="292" rx="8" fill="#fff" stroke="#d6d3d1"/>
  <text x="56" y="124" class="label">스마트키</text>
  <text x="56" y="152" class="body">사용설명서가 적는 작동기</text>
  <line x1="56" y1="176" x2="398" y2="176" stroke="#e7e5e4"/>
  <text x="56" y="208" class="body">도어 잠금 → 원격 시동</text>
  <text x="56" y="236" class="body">전진 또는 후진 버튼을 누른 채 유지</text>
  <text x="56" y="264" class="body">놓으면 정지. 약 4 m, 1회 최대 7 m</text>
  <rect x="56" y="300" width="250" height="36" rx="6" fill="#1c1917"/>
  <text x="72" y="324" class="body" fill="#faf8f5">차는 이 버튼으로 움직인다</text>

  <rect x="458" y="88" width="390" height="292" rx="8" fill="#fff" stroke="#d6d3d1"/>
  <text x="482" y="124" class="label">스마트폰</text>
  <text x="482" y="152" class="body">마이현대의 디지털키 경로</text>
  <line x1="482" y1="176" x2="824" y2="176" stroke="#e7e5e4"/>
  <text x="482" y="208" class="body">BLE 디지털키. 기능 번호 1536</text>
  <text x="482" y="236" class="body">상태 패킷이 와야 홈 버튼이 생긴다</text>
  <text x="482" y="264" class="body">스마트키 버튼을 대신 누르지 못한다</text>
  <rect x="482" y="300" width="286" height="36" rx="6" fill="#9a3412"/>
  <text x="498" y="324" class="body" fill="#fff">버튼 없음 ≠ 1536 무응답</text>
</svg>
