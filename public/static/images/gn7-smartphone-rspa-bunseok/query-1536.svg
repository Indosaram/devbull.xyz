<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-labelledby="title">
  <title id="title">앱이 1536을 묻는 시점</title>
  <style>
    text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1c1917; }
    .h { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
    .b { font-size: 15px; }
    .s { font-size: 13px; fill: #57534e; }
    .w { fill: #faf8f5; }
  </style>
  <rect width="880" height="360" fill="#faf8f5"/>
  <text x="32" y="36" class="h">1536 전용 질의는 이미 참일 때만</text>

  <rect x="32" y="64" width="250" height="132" rx="8" fill="#fff" stroke="#d6d3d1"/>
  <text x="52" y="96" class="h">일반 연결</text>
  <text x="52" y="128" class="b">RKE, 블루투스 권한</text>
  <text x="52" y="152" class="b">등록 성공 1.5초 뒤</text>
  <text x="52" y="176" class="s">기능 번호 배열은 비어 있음</text>

  <rect x="314" y="64" width="250" height="132" rx="8" fill="#1c1917"/>
  <text x="334" y="96" class="h w">재확인</text>
  <text x="334" y="128" class="b w">이미 원격주차로 연결 중</text>
  <text x="334" y="152" class="b w">지원 플래그가 이미 참</text>
  <text x="334" y="176" class="s w">이때만 1536을 지정</text>

  <rect x="596" y="64" width="252" height="132" rx="8" fill="#fff" stroke="#9a3412"/>
  <text x="616" y="96" class="h">상태 패킷</text>
  <text x="616" y="128" class="b">functionId 가 1536</text>
  <text x="616" y="152" class="b">상태 값은 보지 않음</text>
  <text x="616" y="176" class="s">오면 플래그를 참으로</text>

  <rect x="32" y="228" width="816" height="96" rx="8" fill="#fff" stroke="#d6d3d1"/>
  <text x="56" y="268" class="b">버튼이 없는 화면은 왼쪽 칸에 머문다. 가운데 질의는 나가지 않는다.</text>
  <text x="56" y="296" class="s">그래서 “버튼이 없다”를 “제어기가 1536 질의에 침묵했다”로 읽을 수 없다.</text>
</svg>
